<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order - Warehouse WMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/portal/dashboard">Warehouse WMS | Client Portal</a>
            <div class="d-flex align-items-center">
                <a href="/portal/dashboard" class="btn btn-outline-light btn-sm me-2">Back to Dashboard</a>
                <a href="/auth/logout" class="btn btn-outline-danger btn-sm">Sign Out</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3 fw-bold">
                        Create Customer Warehouse Order
                    </div>
                    <div class="card-body p-4">
                        <form method="POST">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Select Catalog SKU</label>
                                <select name="product_id" class="form-select" required>
                                    {% for p in products %}
                                        <option value="{{ p.id }}">{{ p.sku }} - {{ p.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Order Quantity</label>
                                <input type="number" name="quantity" class="form-control" value="5" min="1" max="1000" required>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success py-2 fw-semibold">Submit Order to Warehouse</button>
                                <a href="/portal/dashboard" class="btn btn-light border py-2">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
