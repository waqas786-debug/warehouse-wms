<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - {{ brand.company_name }} {{ brand.company_tagline }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; font-family: 'Inter', system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: #fff; border-radius: 18px; box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08); border: 1px solid #eef0f4; max-width: 440px; width: 100%; overflow: hidden; }
        .brand-badge { width: 42px; height: 42px; background: #e85d3f; color: #fff; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.25rem; }
        .btn-accent { background: #e85d3f; color: #fff; border: none; }
        .btn-accent:hover { background: #d64c2e; color: #fff; }
        .nav-pills .nav-link { color: #64748b; font-weight: 600; border-radius: 10px; }
        .nav-pills .nav-link.active { background: #e85d3f; color: #fff; }
    </style>
</head>
<body>
<div class="container px-3">
    <div class="auth-card mx-auto p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center gap-2 mb-2">
                {% if brand.logo_url %}
                <img src="{{ brand.logo_url }}" style="height:40px;width:40px;object-fit:contain;border-radius:10px;">
                {% else %}
                <span class="brand-badge"><i class="bi bi-box-seam-fill"></i></span>
                {% endif %}
                <span class="fs-4 fw-bold text-dark">{{ brand.company_name }} <small class="text-muted fw-normal">{{ brand.company_tagline }}</small></span>
            </div>
            <p class="text-muted small mb-0">{{ brand.warehouse_address }}</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for cat, msg in messages %}
              <div class="alert alert-{{ cat if cat != 'message' else 'info' }} py-2 small rounded-3">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <ul class="nav nav-pills nav-justified bg-light p-1 rounded-3 mb-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link {{ 'active' if request.args.get('tab') != 'register' else '' }}" id="login-tab" data-bs-toggle="pill" data-bs-target="#loginPane" type="button">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Login
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link {{ 'active' if request.args.get('tab') == 'register' else '' }}" id="register-tab" data-bs-toggle="pill" data-bs-target="#registerPane" type="button">
                    <i class="bi bi-person-plus-fill me-1"></i> Register
                </button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- LOGIN FORM -->
            <div class="tab-pane fade {{ 'show active' if request.args.get('tab') != 'register' else '' }}" id="loginPane">
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control form-control-lg rounded-3" placeholder="Enter username" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg rounded-3" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-accent btn-lg w-100 rounded-3 fw-semibold">Login to Portal</button>
                </form>
            </div>

            <!-- REGISTER FORM -->
            <div class="tab-pane fade {{ 'show active' if request.args.get('tab') == 'register' else '' }}" id="registerPane">
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Company / Dealer Name</label>
                        <input type="text" name="full_name" class="form-control rounded-3" placeholder="e.g. Al-Madina Lubricants" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control rounded-3" placeholder="Choose a login username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control rounded-3" placeholder="dealer@company.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control rounded-3" placeholder="Create password" minlength="4" required>
                    </div>
                    <button type="submit" class="btn btn-accent btn-lg w-100 rounded-3 fw-semibold">Create Client Account</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
